<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ease-hover-bg-darken-gradient – Darken Overlay on Hover</title>
  <link rel="stylesheet" href="../../core/easemotion.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="ease-bg-gray-50 ease-min-h-screen ease-flex ease-items-center ease-justify-center">

  <div class="ease-container ease-text-center ease-py-16">
    <h1 class="ease-text-3xl ease-font-bold ease-mb-4 ease-fade-in">Gradient Overlay on Hover</h1>
    <p class="ease-text-gray-500 ease-mb-8 ease-fade-in ease-delay-200">
      Hover over the image to see a dark gradient overlay fade in.
    </p>

    <div class="darken-card ease-max-w-sm ease-mx-auto ease-overflow-hidden ease-rounded-xl ease-shadow-md">
      <img src="https://placehold.co/400x300" alt="Sample" class="ease-w-full">
    </div>

    <p class="ease-text-sm ease-text-gray-400 ease-mt-8 ease-fade-in ease-delay-500">
      Uses <code>::after</code> with opacity transition. <code>--ease-overlay-opacity</code> controls strength.
    </p>
  </div>

</body>
</html>
